    <button class="motion" id="motion" type="button" aria-pressed="false" title="暂停背景动画">

  <main id="top">
    <section class="hero sub">
      <p class="eyebrow"><span class="pulse" aria-hidden="true"></span>Latest Papers from Top Journals</p>
      <h1 class="title"><span class="line shimmer">学术前沿</span></h1>
      <p class="lede">每日从期刊官方 RSS、Crossref 与预印本官方接口汇总近 30 天的新论文，按期刊分组。点标题在阅读面板看摘要与封面，已读和收藏保存在本浏览器。</p>
      <form class="search" id="search" role="search" autocomplete="off">
        <div class="field">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" name="q" placeholder="搜索标题关键词，如 perovskite、单细胞、CRISPR…" aria-label="搜索论文">
        </div>
        <div class="under">
          <div class="access chips" id="cats" role="group" aria-label="按分类筛选"></div>
        </div>
        <div class="under nw-bar">
          <label class="nw-journal"><span class="sr-only">按期刊筛选</span><select id="journal"></select></label>
          <label class="nw-journal"><span class="sr-only">发表时间</span><select id="since">
            <option value="">全部时间</option><option value="1">今天</option><option value="3">近 3 天</option><option value="7">近 7 天</option><option value="14">近 14 天</option>
          </select></label>
          <label class="nw-journal"><span class="sr-only">排列方式</span><select id="view">
            <option value="journal">按期刊分组</option><option value="time">按时间排列</option>
          </select></label>
          <div class="access chips" id="flags" role="group" aria-label="更多筛选"></div>
        </div>
      </form>
      <dl class="stats news-stats" id="stats"></dl>
    </section>

    <div class="layout">
      <aside class="side" aria-label="分类目录"><nav id="sideNav"></nav></aside>
      <div class="content" id="content"><noscript><p class="empty">本页的列表与搜索需要启用 JavaScript，请在浏览器设置中开启后刷新。</p></noscript></div>
    </div>
    <p class="empty" id="empty" hidden>没有匹配的论文，换个关键词、分类或期刊试试。</p>
  </main>

  <footer class="foot">
    <p>Astra 星图 · 学术前沿 · <span id="gen"></span> · <a class="link" href="https://luffysite.top/">回到博客</a></p>
    <p class="muted">标题、摘要、封面与 DOI 等元数据来自各期刊官方 Feed、Crossref、Europe PMC 与预印本官方接口，论文版权归出版方与作者</p>
  </footer>
  <dialog class="viewer reader" id="reader" aria-labelledby="rd-t">
    <div class="vw-stage" id="rdStage"></div>
    <div class="vw-info">
      <header class="vw-head">
        <div><p class="nw-meta" id="rdMeta"></p><h2 id="rd-t"></h2></div>
        <button type="button" class="icon-btn" data-act="rd-close" aria-label="关闭阅读面板"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div class="vw-body" id="rdBody"></div>
      <nav class="vw-nav" aria-label="切换论文">
        <button type="button" class="btn" data-act="rd-prev" aria-label="上一篇"><kbd>←</kbd> 上一篇</button>
        <span class="vw-count" id="rdCount"></span>
        <button type="button" class="btn" data-act="rd-next" aria-label="下一篇">下一篇 <kbd>→</kbd></button>
      </nav>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <p class="sr-only" id="live" aria-live="polite"></p>
