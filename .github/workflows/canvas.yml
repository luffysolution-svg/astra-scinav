# 同步纯上游 fork；main 有更新时由独立画布的 Vercel Git 集成自动发布。
# CANVAS_FORK_TOKEN 需要 fork 的 Contents / Workflows 读写权限；不强推。
name: 同步画布站

on:
  push:
    branches: [main]
    paths: [.github/workflows/canvas.yml]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas
  cancel-in-progress: false

jobs:
  canvas:
    if: github.event_name != 'schedule' || vars.CANVAS_SYNC_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.CANVAS_FORK_TOKEN }}
      FORK: luffysolution-svg/infinite-canvas
      UPSTREAM: basketikun/infinite-canvas
    steps:
      - name: 同步 fork main 与上游
        run: |
          gh api -X POST "repos/$FORK/merge-upstream" -f branch=main --jq '"merge_type=\(.merge_type)：\(.message)"' || {
            echo "::error::同步 fork 失败；检查 CANVAS_FORK_TOKEN 权限或上游合并冲突。Vercel 线上保持上一版。"
            exit 1
          }
      - name: 记录同步版本
        run: |
          fork_sha=$(gh api "repos/$FORK/commits/main" --jq .sha)
          upstream_sha=$(gh api "repos/$UPSTREAM/commits/main" --jq .sha)
          {
            echo "### 画布上游同步完成"
            echo "- fork main：$fork_sha"
            echo "- 上游 main：$upstream_sha"
            echo "- fork 有更新时由 Vercel Git 集成自动构建发布。"
          } >> "$GITHUB_STEP_SUMMARY"