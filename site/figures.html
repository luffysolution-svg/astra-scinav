      <p class="lede">从官方文档与 GitHub 开源项目收录的绘图模板：Origin、Python、R 与科研示意图。点图片看大图，开源示例可直接复制代码；页末附期刊尺寸与色盲友好配色速查。</p>
      <form class="search" id="search" role="search" autocomplete="off">
        <div class="field">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" name="q" placeholder="搜索图表，如 火山图、热图、小提琴、ggplot…" aria-label="搜索绘图模板">
        </div>
        <div class="under">
          <div class="access chips" id="types" role="group" aria-label="按图表类型筛选"></div>
        </div>
      </form>
      <dl class="stats" id="stats"></dl>
    </section>

    <div class="layout">
      <aside class="side" aria-label="分类目录"><nav id="sideNav"></nav></aside>

  <dialog class="viewer" id="viewer" aria-labelledby="vw-t">
    <div class="vw-stage" id="vwStage"></div>
    <div class="vw-info">
      <header class="vw-head">
        <div><h2 id="vw-t"></h2><p class="vw-en" id="vwEn"></p></div>
        <button type="button" class="icon-btn" data-act="vw-close" aria-label="关闭预览"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div class="vw-body" id="vwBody"></div>
      <nav class="vw-nav" aria-label="切换模板">
        <button type="button" class="btn" data-act="vw-prev" aria-label="上一个"><kbd>←</kbd> 上一个</button>
        <span class="vw-count" id="vwCount"></span>
        <button type="button" class="btn" data-act="vw-next" aria-label="下一个">下一个 <kbd>→</kbd></button>
      </nav>
    </div>
  </dialog>

  <dialog class="dlg" id="dlg" aria-labelledby="dlg-t">
    <form name="suggest-figure" method="post" data-netlify="true" netlify-honeypot="bot-field" id="dlgForm">
      <h2 id="dlg-t">推荐绘图模板</h2>
      <input type="hidden" name="form-name" value="suggest-figure">
      <p class="hp" aria-hidden="true"><label>勿填 <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
      <label>模板链接<input name="url" type="url" required placeholder="官方文档或 GitHub 页面 https://"></label>
      <label>说明<textarea name="desc" rows="3" maxlength="300" placeholder="什么图、用什么工具画的（可选）"></textarea></label>
      <p class="dlg-msg" id="dlgMsg" role="alert"></p>
      <div class="dlg-act">
        <button type="button" class="btn" data-act="close">取消</button>
        <button type="submit" class="btn primary">提交</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <p class="sr-only" id="live" aria-live="polite"></p>
