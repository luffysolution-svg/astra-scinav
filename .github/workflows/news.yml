# 每日同步学术前沿：期刊官方 RSS/Atom、Crossref 与 arXiv / bioRxiv / medRxiv 官方 API，补摘要与封面，有变化就提交到 main
# 推送后由 deploy.yml 的 workflow_run 接续发布到 Vercel（需配置发布凭据）。
# 用 GITHUB_TOKEN 推送的提交不会再触发其他工作流（含本工作流与 check.yml），不会循环执行。
name: 同步学术前沿

on:
  schedule:
    - cron: '0 22 * * *'   # 每天 06:00（北京时间）
  workflow_dispatch:

permissions:
  contents: write

# 与每周同步、链接核验共用一组，避免同时推送互相冲突
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 ffmpeg（封面转 WebP）
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: 同步
        run: node scripts/sync_news.mjs
      - name: 更新期刊封面
        run: node scripts/sync_news_journal_covers.mjs
      - name: 更新新增日期
        run: node scripts/status.mjs
      - name: 校验
        run: node scripts/validate.mjs
      - name: 有变化则提交
        run: |
          git add -A -- content/news.json site/data/news.js site/data/news-abstracts content/news-journal-covers.json site/data/news-journal-covers.js content/status.json site/data/status.js
          # 封面目录：新增与过期删除都要记录；目录被清空时只记录删除
          if [ -d site/news ]; then git add -- site/news; else git rm -r -q --cached --ignore-unmatch site/news; fi
          if [ -d site/news-journals ]; then git add -A -- site/news-journals; else git rm -r -q --cached --ignore-unmatch site/news-journals; fi
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898278+github-actions[bot]@users.noreply.github.com'
          git commit -m "同步学术前沿（$(TZ=Asia/Shanghai date +%F)）"
          git pull --rebase
          git push
