<body data-page="prompts">
  <canvas id="galaxy" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="./" aria-label="Astra 星图 首页">
      <span class="brand-mark" aria-hidden="true"><i></i></span>
      <span class="brand-name">Astra<em>星图</em></span>
    </a>
    <nav class="page-nav" aria-label="页面">
      <a href="./">导航</a>
      <a href="skills.html">科研 SKILL</a>
      <a href="prompts.html" aria-current="page">科研 Prompt</a>
      <a href="figures.html">科研绘图</a>
    </nav>
    <span class="spacer"></span>
    <a class="blog-link" href="https://luffysite.top/" title="Luffy 的个人博客">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg><span>博客</span>
    </a>
    <button class="motion" id="motion" type="button" aria-pressed="false" title="暂停背景动画">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><ellipse cx="12" cy="12" rx="9.5" ry="3.6" transform="rotate(-18 12 12)"/></svg>
      <span class="sr-only">暂停背景动画</span>
    </button>
  </header>

  <main id="top">
    <section class="hero sub">
      <p class="eyebrow"><span class="pulse" aria-hidden="true"></span>Prompts for Research</p>
      <h1 class="title"><span class="line shimmer">科研 Prompt</span></h1>
      <p class="lede">从开源仓库精选的科研提示词，按科研流程分类。<mark class="ph">[方括号]</mark> 是需要替换的内容，点「复制」即可粘贴到任意 AI 对话中。</p>
      <form class="search" id="search" role="search" autocomplete="off">
        <div class="field">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" name="q" placeholder="搜索提示词，如 润色、审稿、摘要…" aria-label="搜索提示词">
        </div>
        <div class="under">
          <div class="access" id="langs" role="group" aria-label="按语言筛选"></div>
        </div>
      </form>
      <dl class="stats" id="stats"></dl>
    </section>

    <div class="layout">
      <aside class="side" aria-label="分类目录"><nav id="sideNav"></nav></aside>
      <div class="content" id="content"><noscript><p class="empty">本站的目录与搜索需要启用 JavaScript，请在浏览器设置中开启后刷新。</p></noscript></div>
    </div>
    <p class="empty" id="empty" hidden>没有匹配的提示词，换个关键词试试。</p>
  </main>

  <footer class="foot">
    <p>Astra 星图 · 科研 Prompt · <span id="gen"></span> · <a class="link" href="https://luffysite.top/">回到博客</a></p>
    <p class="muted">提示词版权归原仓库作者，协议以卡片与来源列表标注为准；只摘录已声明允许再分发协议的内容，未声明协议的仓库仅列出链接 · <button type="button" class="link" data-act="suggest">推荐提示词</button></p>
  </footer>

  <dialog class="dlg" id="dlg" aria-labelledby="dlg-t">
    <form name="suggest-prompt" method="post" data-netlify="true" netlify-honeypot="bot-field" id="dlgForm">
      <h2 id="dlg-t">推荐提示词</h2>
      <input type="hidden" name="form-name" value="suggest-prompt">
      <p class="hp" aria-hidden="true"><label>勿填 <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
      <label>用途<input name="title" required maxlength="40" placeholder="如：审稿意见逐条回复"></label>
      <label>提示词<textarea name="prompt" rows="6" required maxlength="4000" placeholder="需要替换的内容用 [方括号] 标出"></textarea></label>
      <label>来源链接<input name="url" type="url" placeholder="GitHub 仓库或原文链接（可选，便于核实协议）"></label>
      <p class="dlg-msg" id="dlgMsg" role="alert"></p>
      <div class="dlg-act">
        <button type="button" class="btn" data-act="close">取消</button>
        <button type="submit" class="btn primary">提交</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <p class="sr-only" id="live" aria-live="polite"></p>

  <script src="data/prompts.js"></script>
  <script src="data/status.js"></script>
  <script src="galaxy.js"></script>
  <script src="common.js"></script>
  <script src="collection.js"></script>
</body>
</html>
